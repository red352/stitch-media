[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stitch-media"
version = "0.1.0"
description = "Intelligent media stitch & split toolkit with multimodal adaptive alignment, smooth overlap blending, and gap compensation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "red352" }
]
keywords = [
    "video-stitching",
    "audio-alignment",
    "media-processing",
    "ffmpeg",
    "video-split",
    "multimodal",
    "python-cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pillow>=9.5.0",
    "imagehash>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
stitch-media = "stitch_media.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["stitch_media"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
