name: Bug Report
description: File a bug report to help us improve stitch-media
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: ffmpeg-version
    attributes:
      label: FFmpeg Version
      description: Run `ffmpeg -version` and paste the first line.
      placeholder: e.g. ffmpeg version 7.0...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11 / Ubuntu 24.04 / macOS Sonoma
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command and steps to reproduce the issue.
      placeholder: |
        1. Run `stitch-media join clip1.mp4 clip2.mp4 -o out.mp4`
        2. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output or stack traces.
      render: shell
